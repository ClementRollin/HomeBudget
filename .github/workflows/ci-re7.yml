name: CI — re7 (recette)

on:
  pull_request:
    branches:
      - re7
  push:
    branches:
      - re7

jobs:
  ci:
    name: Full test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homebudget_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homebudget_test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_TEST }}

      - name: Integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/homebudget_test
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY_TEST }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET_TEST }}

  deploy-re7:
    name: Deploy to re7
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
